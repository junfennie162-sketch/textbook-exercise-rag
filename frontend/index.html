<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="基于 RAG 的教材习题解析生成器：上传教材与习题，检索依据，生成带引用标注的解析并导出交付。" />
    <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)" />
    <!-- 应用标识（ASCII）：一键部署脚本据此确认 5173 端口上跑的是本应用，而非其他程序 -->
    <meta name="app-id" content="exercise-solver-workbench" />
    <title>教材习题解析生成器 · RAG Workbench</title>
    <script>
      // 首屏前应用已保存的主题，避免深浅色闪烁
      try {
        var stored = localStorage.getItem('workbench-theme')
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.setAttribute('data-theme', stored)
        }
      } catch (error) {
        /* localStorage 不可用时跟随系统 */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
